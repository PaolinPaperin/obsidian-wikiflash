name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          min_app_version="$(node -p "require('./manifest.json').minAppVersion")"
          versions_min_app="$(node -p "require('./versions.json')[process.env.GITHUB_REF_NAME]")"

          test "$manifest_version" = "$version"
          test "$versions_min_app" = "$min_app_version"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/main.js
            ${{ github.workspace }}/manifest.json
            ${{ github.workspace }}/styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --clobber
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "WikiFlash $GITHUB_REF_NAME"
          fi
